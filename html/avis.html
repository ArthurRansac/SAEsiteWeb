<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Donnez votre avis sur notre site des 3 Vallées">
        <title>Votre avis - Les 3 Vallées</title>
        <link id="theme" rel="stylesheet" href="../css/style.css">
        <link rel="icon" href="../assets/fav.png">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    </head>
    <body class="page-avis">
        <header class="site-header">
            <nav class="navbar" aria-label="Navigation principale">
                <div class="nav-center">
                    <a class="instagram" href="https://www.instagram.com/les3vallees_officiel/">
                        <img src="../assets/instagram.svg" alt="Instagram des 3 Vallées" width="20" height="20">
                    </a>
                    <a class="logo" href="index.html">
                        <img src="../assets/Logo.png" alt="Les 3 Vallées — Accueil" width="96" height="44">
                    </a>
                    <div class="nav-links">
                        <a href="Forfaits.html">Forfaits <img src="../assets/forfaits.svg" alt="" width="16" height="16"></a>
                        <a href="Reservation.html">Réservation <img src="../assets/external.svg" alt="" width="14" height="14"></a>
                    </div>
                </div>
                <div class="searchbar">
                    <input type="search" aria-label="Rechercher" placeholder="Rechercher…">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <details class="dropdown-container">
                    <summary>Catégories<i class="fa-solid fa-angle-down" aria-hidden="true"></i></summary>
                    <div class="dropdown">
                        <a href="Domaine.html">Le domaine</a>
                        <a href="Stations.html">Les stations</a>
                        <a href="Reservation.html">Réservation</a>
                        <a href="Forfaits.html">Forfaits</a>
                        <a href="sources.html">Sources</a>
                    </div>
                </details>
            </nav>
        </header>
        <main class="avis-contenu">
            <section class="avis-formulaire">
                <h1>Votre avis</h1>
                <p>Partagez vos impressions sur notre site</p>
                <!-- Formulaire inspiré du modèle de Mickaël Martin Nevot et Pierre-Alexis de Solminihac -->
                <form action="mailto:?subject=Avis%20sur%20le%20site%20Les%203%20Vall%C3%A9es" method="post" enctype="text/plain">
                    <div class="avis-identite">
                        <div>
                            <label for="prenom">Prénom</label>
                            <input class="champ-avis" id="prenom" type="text" name="prenom" required>
                        </div>
                        <div>
                            <label for="nom">Nom</label>
                            <input class="champ-avis" id="nom" type="text" name="nom">
                        </div>
                    </div>
                    <fieldset>
                        <legend>Vous êtes</legend>
                        <label><input type="radio" name="sexe" value="homme"> Homme</label>
                        <label><input type="radio" name="sexe" value="femme"> Femme</label>
                    </fieldset>
                    <label for="impression">Votre message</label>
                    <textarea class="champ-avis" id="impression" name="impression" rows="5" placeholder="Donnez vos impressions sur le site…" required></textarea>
                    <button type="submit">Envoyer mon avis</button>
                </form>
            </section>
        </main>
        <footer class="site-footer">
            <img src="../assets/LOGO_AMU.webp" alt="Aix-Marseille Université" width="240" height="83">
            <div class="footer-reseaux">
                <a href="https://www.facebook.com/les3vallees.officiel/" aria-label="Facebook des 3 Vallées">
                    <i class="fa-brands fa-square-facebook" aria-hidden="true"></i>
                </a>
                <a href="https://x.com/3Vallees_france?s=20" aria-label="X Twitter des 3 Vallées">
                    <i class="fa-brands fa-square-x-twitter" aria-hidden="true"></i>
                </a>
            </div>
            <nav class="footer-liens" aria-label="Liens de pied de page">
                <!-- button avec js pour le changement de feuille de style viens de : https://www.geeksforgeeks.org/javascript/how-to-switch-between-multiple-css-stylesheets-using-javascript/ -->
                <button onclick="toggleTheme()">Switch</button>
                <script>
                    function toggleTheme() {
                        // Select the <link> element
                        let theme = document.getElementById('theme');

                        // Toggle between light.css and dark.css
                        if (theme.getAttribute('href') == '../css/style.css') {
                            theme.setAttribute('href', '../css/alternate.css');
                        } else {
                            theme.setAttribute('href', '../css/style.css');
                        }
                    }
                </script>
                <a href="sources.html">Sources</a>
                <a href="avis.html">Donnez un avis !</a>
            </nav>
        </footer>
    </body>
</html>
